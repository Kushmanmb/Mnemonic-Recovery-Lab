[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemonic-recovery-lab"
version = "0.1.0"
license = "Apache-2.0"
description = "Offline BIP-39 validation and recovery analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mnemonic==0.21"]

[project.optional-dependencies]
dev = [
	"bandit==1.9.4",
	"mypy==2.4.1",
	"pip-audit==2.10.1",
	"pytest==9.2.0",
	"ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mnemonic_recovery = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
