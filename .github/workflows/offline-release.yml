name: Offline validator release candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'offline-app/**'
      - 'tests/web/offline.spec.js'
      - '.github/workflows/offline-release.yml'
      - 'scripts/build_offline_release.py'
      - 'tests/test_offline_release.py'
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser security and BIP-39 tests
        run: npx playwright test tests/web/offline.spec.js
      - name: Check bundled scripts parse
        run: node --check offline-app/app.js && node --check offline-app/wordlist.js
      - name: Build reproducible release candidate
        run: python scripts/build_offline_release.py --out dist
      - name: Verify the build is reproducible
        shell: bash
        run: |
          touch -d '2001-01-01 00:00:00' offline-app/*
          python scripts/build_offline_release.py --out dist-rebuild
          cmp dist/mnemonic-recovery-offline-app.zip dist-rebuild/mnemonic-recovery-offline-app.zip
          diff dist/SHA256SUMS dist-rebuild/SHA256SUMS
          echo "Reproducible: $(head -1 dist/SHA256SUMS)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mnemonic-recovery-offline-app-release-candidate
          path: dist/
          if-no-files-found: error
